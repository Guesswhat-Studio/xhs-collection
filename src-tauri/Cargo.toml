[package]
name = "xhs-collection"
version = "0.1.0"
description = "Local-first desktop collection manager for Xiaohongshu favorites"
authors = ["GuesswhatStudio"]
license = "MIT"
edition = "2021"

[lib]
name = "xhs_collection_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
keyring = "4.0.1"
keyring-core = "1.0.0"
log = "0.4"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2.4.3"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
